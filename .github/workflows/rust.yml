name: Rust
on:
  push:
    branches:
      - main
    tags:
      - "**"

  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Fat LTO is only worth paying for on artifacts we publish
  CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Fmt
        run: cargo fmt --all -- --files-with-diff --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Unused dependencies
        run: cargo machete

  check-crates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check individual crates
        run: |
          set -e
          cargo check
          cargo check --all-features
          cargo check -p chia-sdk-driver
          cargo check -p chia-sdk-driver --all-features
          cargo check -p chia-sdk-driver -F chip-0057
          cargo check -p chia-sdk-client
          cargo check -p chia-sdk-client --all-features
          cargo check -p chia-sdk-coinset
          cargo check -p chia-sdk-coinset --all-features
          cargo check -p chia-sdk-cli
          cargo check -p chia-sdk-signer
          cargo check -p chia-sdk-test
          cargo check -p chia-sdk-test --all-features
          cargo check -p chia-sdk-test -F chip-0057
          cargo check -p chia-sdk-types
          cargo check -p chia-sdk-types --all-features
          cargo check -p chia-sdk-types -F chip-0057
          cargo check -p chia-sdk-utils
          cargo check -p chia-sdk-utils -F chip-0057
          cargo check -p chia-sdk-bindings -F napi
          cargo check -p chia-sdk-bindings -F wasm
          cargo check -p chia-sdk-bindings -F pyo3

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --release --workspace --exclude chia-wallet-sdk-napi --exclude chia-sdk-derive --exclude chia-wallet-sdk-py --exclude chia-wallet-sdk-wasm --exclude chia-sdk-bindings --exclude bindy --exclude bindy-macro --all-features

  publish:
    if: startsWith(github.event.ref, 'refs/tags')
    needs: [lint, check-crates, test]
    # Trusted publishing requires a GitHub-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo ws publish --publish-as-is --allow-dirty
