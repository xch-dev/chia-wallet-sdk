name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Each language's checks live in their own reusable workflow. The permissions granted here are
# the most each called workflow's jobs can request.
jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
      id-token: write

  napi:
    name: Node.js
    uses: ./.github/workflows/napi.yml
    permissions:
      contents: read
      id-token: write

  wasm:
    name: WASM
    uses: ./.github/workflows/wasm.yml
    permissions:
      contents: read
      id-token: write

  pyo3:
    name: Python
    uses: ./.github/workflows/pyo3.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  # The only check that branch protection needs to require. A skipped job counts as passing, so
  # this always runs and fails explicitly if anything it depends on didn't succeed.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [rust, napi, wasm, pyo3]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed"
          exit 1
