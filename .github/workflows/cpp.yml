name: C++

on:
  push:
    branches:
      - main
    tags:
      - "**"
      # Pushed by the Go release job
      - "!go/**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNIFFI_BINDGEN_CPP: v0.10.0+v0.31.0
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      # Installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Install Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uniffi-bindgen-cpp*
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cpp-${{ matrix.settings.target }}-${{ env.UNIFFI_BINDGEN_CPP }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uniffi-bindgen-cpp
        run: |
          if ! command -v uniffi-bindgen-cpp > /dev/null; then
            cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag "$UNIFFI_BINDGEN_CPP" --locked
          fi

      - name: Build and generate bindings
        run: ./cpp/generate.sh ${{ matrix.settings.target }}

      - name: Test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure

      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: cpp-${{ matrix.settings.target }}
          path: cpp/generated/
          if-no-files-found: error
