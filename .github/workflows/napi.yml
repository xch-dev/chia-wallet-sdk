name: Node.js
on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DEBUG: napi:*
  APP_NAME: chia-wallet-sdk
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always
  # Fat LTO is only worth paying for on artifacts we publish
  CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: ./napi
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Build both macOS targets on a single runner (macOS minutes are the most expensive)
          - host: blacksmith-6vcpu-macos-latest
            target: apple-darwin
            build: |
              pnpm build:macos-x64
              pnpm build:macos-arm64
              pnpm universal
          - host: blacksmith-8vcpu-windows-2025
            build: pnpm build:windows-x64
            target: x86_64-pc-windows-msvc
          # Linux builds use napi's glibc 2.17 cross toolchain. Each target is built on the other
          # architecture, since cc-rs ignores the cross C compiler when the host and target match
          # and would compile C dependencies against the runner's newer glibc headers instead.
          - host: blacksmith-8vcpu-ubuntu-2404-arm
            target: x86_64-unknown-linux-gnu
            build: pnpm build:linux-x64 --use-napi-cross
          - host: blacksmith-4vcpu-ubuntu-2404
            target: aarch64-unknown-linux-gnu
            build: |
              # napi's cross gcc doesn't define __ARM_ARCH, which ring's assembly requires
              export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"
              pnpm build:linux-arm64 --use-napi-cross
    name: stable - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml

      - name: Install
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target == 'apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.settings.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.settings.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ runner.os == 'Windows' }}

      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ runner.os != 'Windows' }}
        shell: bash

      - name: Show required GLIBC versions
        if: ${{ runner.os == 'Linux' }}
        run: readelf --dyn-syms --wide ./*.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-binding:
    name: Test bindings on macOS
    needs:
      - build
    defaults:
      run:
        working-directory: ./napi
    # Test every Node version in one job, since macOS minutes are the most expensive
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-apple-darwin
          path: napi

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings on node@24 (arm64)
        run: pnpm test

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Test bindings on node@22 (arm64)
        run: pnpm test

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Test bindings on node@20 (arm64)
        run: pnpm test

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          architecture: x64

      - name: Test bindings on node@24 (x64 under Rosetta)
        run: pnpm test

  test-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    defaults:
      run:
        working-directory: ./napi
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2022
            target: x86_64-pc-windows-msvc
        node:
          - "20"
          - "22"
          - "24"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml
          architecture: x64

      - name: Install dependencies
        run: pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings
        run: pnpm test

  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    defaults:
      run:
        working-directory: ./napi
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "22"
          - "24"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: napi

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings in docker
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: node:${{ matrix.node }}-slim
          options: "--user 0:0 -v ${{ github.workspace }}:/build -w /build"
          run: |
            set -e
            cd napi
            npm i -g pnpm
            pnpm test

  test-linux-aarch64-gnu-binding:
    name: Test bindings on aarch64-unknown-linux-gnu - node@${{ matrix.node }}
    needs:
      - build
    defaults:
      run:
        working-directory: ./napi
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "22"
          - "24"
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: napi

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings in docker
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: node:${{ matrix.node }}-slim
          options: "--user 0:0 -v ${{ github.workspace }}:/build -w /build"
          run: |
            set -e
            cd napi
            npm i -g pnpm
            pnpm test

  publish:
    name: Publish
    # npm provenance requires a GitHub-hosted runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - test-macOS-binding
      - test-windows-binding
      - test-linux-x64-gnu-binding
      - test-linux-aarch64-gnu-binding
    defaults:
      run:
        working-directory: ./napi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: napi/artifacts

      - name: Move artifacts
        run: pnpm artifacts

      - name: List packages
        run: ls -R ./npm
        shell: bash

      - name: Publish
        if: startsWith(github.event.ref, 'refs/tags')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set provenance true
          npm publish --access public
