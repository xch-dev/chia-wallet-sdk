name: UniFFI

# Builds and tests the Go, .NET, and C++ bindings, which are all generated from the
# `chia-wallet-sdk-uniffi` library.
on:
  # Releases run standalone so publishing sees this workflow, not ci.yml
  push:
    tags:
      - "**"
      # Pushed by the Go release job
      - "!go/**"
  workflow_call:
  # Rehearses a release: runs every release step except publishing, and uploads the Go module zip
  # and the NuGet package as artifacts
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_GO: v0.7.1+v0.31.0
  UNIFFI_BINDGEN_CS: v0.11.1+v0.31.0
  UNIFFI_BINDGEN_CPP: v0.10.0+v0.31.0
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # Fat LTO is only worth paying for on artifacts we publish, or rehearse publishing
  CARGO_PROFILE_RELEASE_LTO: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
  # Releases are published from tag pushes. Manual runs do everything else.
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
  # The x86_64 macOS libraries can't be tested on the arm64 runners, so pull requests skip them.
  # They're still built on main and for releases.
  BUILD_MACOS_X64: ${{ github.event_name != 'pull_request' }}

jobs:
  go:
    name: Go - ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
          # The cmake crate doesn't support the Visual Studio 2026 on windows-latest
          - host: windows-2022
            target: x86_64-pc-windows-gnu
            platform: windows_amd64
          # Uses the LLVM MinGW target, since GCC doesn't support Windows on arm64
          - host: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            platform: windows_arm64
            cc: aarch64-w64-mingw32-clang
          # Cross-compiled with the runner's Android NDK, so the tests are built but not run
          - host: ubuntu-22.04
            target: aarch64-linux-android
            platform: android_arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Install Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install LLVM MinGW
        if: matrix.settings.target == 'aarch64-pc-windows-gnullvm'
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-aarch64
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.zip"
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
          # The cmake crate otherwise looks for MSYS or MinGW make, which this runner doesn't have
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore uniffi-bindgen-go
        id: uniffi-bindgen-go
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go*
          key: uniffi-bindgen-go-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_GO }}

      - name: Install uniffi-bindgen-go
        if: steps.uniffi-bindgen-go.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-go --git https://github.com/NordSecurity/uniffi-bindgen-go --tag "$UNIFFI_BINDGEN_GO" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-go
        if: steps.uniffi-bindgen-go.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go*
          key: uniffi-bindgen-go-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_GO }}

      - name: Build and generate bindings
        run: ./go/generate.sh ${{ matrix.settings.target }}

      - name: Test
        if: matrix.settings.platform != 'android_arm64'
        working-directory: go
        env:
          CC: ${{ matrix.settings.cc }}
        # The race detector doesn't support Windows on arm64
        run: go test ${{ matrix.settings.platform != 'windows_arm64' && '-race' || '' }} -v ./...

      # There's no Android device to run on, so this only checks that the package and its tests
      # compile and link
      - name: Build tests
        if: matrix.settings.platform == 'android_arm64'
        working-directory: go
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          source android-env.sh
          export CC="$ANDROID_CC"
          go vet ./...
          go test -c -o "$RUNNER_TEMP/" ./...

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: go-${{ matrix.settings.platform }}
          path: go/chiawalletsdk/lib/${{ matrix.settings.platform }}/
          if-no-files-found: error

      - name: Upload bindings
        if: matrix.settings.platform == 'linux_amd64'
        uses: actions/upload-artifact@v7
        with:
          name: go-bindings
          path: |
            go/chiawalletsdk/chiawalletsdk.go
            go/chiawalletsdk/chiawalletsdk.h
          if-no-files-found: error

  dotnet:
    name: .NET - ${{ matrix.settings.rid }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
          # The cmake crate doesn't support the Visual Studio 2026 on windows-latest
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            rid: win-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Install Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore uniffi-bindgen-cs
        id: uniffi-bindgen-cs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs*
          key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CS }}

      - name: Install uniffi-bindgen-cs
        if: steps.uniffi-bindgen-cs.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-cs
        if: steps.uniffi-bindgen-cs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs*
          key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CS }}

      - name: Build and generate bindings
        run: ./dotnet/generate.sh ${{ matrix.settings.target }}

      - name: Test
        run: dotnet test dotnet/ChiaWalletSdk.Tests

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-${{ matrix.settings.rid }}
          path: dotnet/ChiaWalletSdk/runtimes/${{ matrix.settings.rid }}/
          if-no-files-found: error

      - name: Upload bindings
        if: matrix.settings.rid == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-bindings
          path: dotnet/ChiaWalletSdk/chiawalletsdk.cs
          if-no-files-found: error

  cpp:
    name: C++ - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      # Installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Install Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore uniffi-bindgen-cpp
        id: uniffi-bindgen-cpp
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cpp*
          key: uniffi-bindgen-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CPP }}

      - name: Install uniffi-bindgen-cpp
        if: steps.uniffi-bindgen-cpp.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag "$UNIFFI_BINDGEN_CPP" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-cpp
        if: steps.uniffi-bindgen-cpp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cpp*
          key: uniffi-bindgen-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CPP }}

      - name: Build and generate bindings
        run: ./cpp/generate.sh ${{ matrix.settings.target }}

      - name: Test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure

      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: cpp-${{ matrix.settings.target }}
          path: cpp/generated/
          if-no-files-found: error

  # The organization can only run a few macOS jobs at once, so every language shares one macOS
  # job. Go and .NET use the same library build, and C++ reuses its compiled dependencies.
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the targets for the toolchain pinned in rust-toolchain.toml
      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          if [ "$BUILD_MACOS_X64" = true ]; then
            rustup target add x86_64-apple-darwin
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-darwin
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore uniffi-bindgen-go
        id: uniffi-bindgen-go
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go*
          key: uniffi-bindgen-go-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_GO }}

      - name: Install uniffi-bindgen-go
        if: steps.uniffi-bindgen-go.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-go --git https://github.com/NordSecurity/uniffi-bindgen-go --tag "$UNIFFI_BINDGEN_GO" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-go
        if: steps.uniffi-bindgen-go.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go*
          key: uniffi-bindgen-go-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_GO }}

      - name: Restore uniffi-bindgen-cs
        id: uniffi-bindgen-cs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs*
          key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CS }}

      - name: Install uniffi-bindgen-cs
        if: steps.uniffi-bindgen-cs.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-cs
        if: steps.uniffi-bindgen-cs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs*
          key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CS }}

      - name: Restore uniffi-bindgen-cpp
        id: uniffi-bindgen-cpp
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cpp*
          key: uniffi-bindgen-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CPP }}

      - name: Install uniffi-bindgen-cpp
        if: steps.uniffi-bindgen-cpp.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag "$UNIFFI_BINDGEN_CPP" --locked

      # Saved right away, so a later failure doesn't throw away the build
      - name: Save uniffi-bindgen-cpp
        if: steps.uniffi-bindgen-cpp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cpp*
          key: uniffi-bindgen-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.UNIFFI_BINDGEN_CPP }}

      - name: Go - build and generate bindings
        run: ./go/generate.sh aarch64-apple-darwin

      - name: Go - test
        working-directory: go
        run: go test -race -v ./...

      - name: .NET - build and generate bindings
        run: ./dotnet/generate.sh aarch64-apple-darwin

      - name: .NET - test
        run: dotnet test dotnet/ChiaWalletSdk.Tests

      - name: Build the x86_64 libraries
        if: env.BUILD_MACOS_X64 == 'true'
        run: |
          ./go/generate.sh x86_64-apple-darwin
          ./dotnet/generate.sh x86_64-apple-darwin

      # Runs after Go and .NET, since the `blocking` build replaces the library they copied
      - name: C++ - build and generate bindings
        run: ./cpp/generate.sh aarch64-apple-darwin

      - name: C++ - test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure

      - name: Upload Go library (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: go-darwin_arm64
          path: go/chiawalletsdk/lib/darwin_arm64/
          if-no-files-found: error

      - name: Upload Go library (x86_64)
        if: env.BUILD_MACOS_X64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-darwin_amd64
          path: go/chiawalletsdk/lib/darwin_amd64/
          if-no-files-found: error

      - name: Upload .NET library (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-osx-arm64
          path: dotnet/ChiaWalletSdk/runtimes/osx-arm64/
          if-no-files-found: error

      - name: Upload .NET library (x86_64)
        if: env.BUILD_MACOS_X64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-osx-x64
          path: dotnet/ChiaWalletSdk/runtimes/osx-x64/
          if-no-files-found: error

      - name: Upload C++ bindings
        uses: actions/upload-artifact@v7
        with:
          name: cpp-aarch64-apple-darwin
          path: cpp/generated/
          if-no-files-found: error

  go-release:
    name: Go - Release
    runs-on: ubuntu-latest
    # Waits for the NuGet package too, so the module isn't published if the package can't be
    needs: [go, macos, dotnet-pack]
    if: (startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/go/')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          name: go-bindings
          path: go/chiawalletsdk

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: go-*_*
          path: go/chiawalletsdk/lib

      - name: Arrange libraries
        working-directory: go/chiawalletsdk/lib
        run: |
          for dir in go-*; do
            mv "$dir" "${dir#go-}"
          done
          ls -R

      # A published tag can't be fixed, so make sure no platform's library is missing
      - name: Verify libraries
        working-directory: go/chiawalletsdk/lib
        run: |
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64 android_arm64; do
            if [ ! -f "$platform/libchia_wallet_sdk.a" ]; then
              echo "The module is missing the static library for $platform" >&2
              exit 1
            fi
          done

      # Manual runs from a branch use the crate version, since there's no release tag
      - name: Determine the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/go/* ]]; then
            echo "Run the release from the release tag or a branch, not from the Go module's tag" >&2
            exit 1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Commit the module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f go/chiawalletsdk/chiawalletsdk.go go/chiawalletsdk/chiawalletsdk.h go/chiawalletsdk/lib
          git commit -m "Go module release ${VERSION}"
          git tag "go/${VERSION}"

      # Tests what users will download: only the files committed to the tag, outside this checkout
      - name: Test the release from a clean checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "go/${VERSION}"
          cd "$RUNNER_TEMP/release/go"
          go vet ./...
          go test -race ./...

      # The module proxy rejects modules over 500 MiB, and every tag carries a static library for
      # each platform
      - name: Create the module zip
        run: |
          go -C .github/go-modzip run . "$RUNNER_TEMP/release/go" github.com/xch-dev/chia-wallet-sdk/go "$VERSION" "$RUNNER_TEMP/go-module.zip"

      - name: Upload the module zip
        uses: actions/upload-artifact@v7
        with:
          name: go-module
          path: ${{ runner.temp }}/go-module.zip
          if-no-files-found: error
          # Already compressed
          compression-level: 0

      - name: Publish the module
        if: env.PUBLISH == 'true'
        run: git push origin "go/${VERSION}"

  dotnet-pack:
    name: .NET - Pack
    runs-on: ubuntu-latest
    needs: [dotnet, macos]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          name: dotnet-bindings
          path: dotnet/ChiaWalletSdk

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: dotnet-*-*
          path: dotnet/ChiaWalletSdk/runtimes

      - name: Arrange libraries
        working-directory: dotnet/ChiaWalletSdk/runtimes
        run: |
          # Each artifact contains the `native` directory for its runtime identifier
          for dir in dotnet-*; do
            mv "$dir" "${dir#dotnet-}"
          done
          ls -R

      - name: Pack
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          dotnet pack dotnet/ChiaWalletSdk -c Release -o dotnet/dist -p:Version="$VERSION"

      - name: Verify package
        run: |
          contents=$(unzip -l dotnet/dist/*.nupkg)
          rids="linux-x64 linux-arm64 osx-arm64 win-x64"
          if [ "$BUILD_MACOS_X64" = true ]; then
            rids="$rids osx-x64"
          fi
          for rid in $rids; do
            if ! grep -qE "runtimes/$rid/native/[^/]+$" <<< "$contents"; then
              echo "The package is missing the native library for $rid" >&2
              exit 1
            fi
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: dotnet/dist/*.nupkg
          if-no-files-found: error

      # The package is published after the Go module, so check that nuget.org's trusted publishing
      # policy accepts this workflow before either is published. The short-lived key is discarded.
      - name: Check NuGet trusted publishing
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: NuGet/login@v1
        with:
          user: Rigidity

  # Runs after the Go module is published. A failed NuGet push can be retried by re-running this
  # job, but a Go tag can't be changed once it's pushed, so it goes first.
  dotnet-publish:
    name: .NET - Publish
    runs-on: ubuntu-latest
    needs: [dotnet-pack, go-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/go/')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: dist

      # Trusted publishing exchanges the workflow's OIDC token for a short-lived API key. The
      # nuget.org policy names this workflow file, which is why releases run it standalone.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Rigidity

      - name: Publish
        run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
