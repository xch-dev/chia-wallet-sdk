[package]
name = "chia-sdk-coinset"
version = "0.37.1"
edition = "2024"
license = "Apache-2.0"
description = "An HTTP client for the Chia full node RPC API, as served by coinset.org or by a full node."
authors = ["Brandon Haggstrom <me@rigidnetwork.com>"]
homepage = "https://github.com/xch-dev/chia-wallet-sdk"
repository = "https://github.com/xch-dev/chia-wallet-sdk"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
hex-literal = { workspace = true }
chia-protocol = { workspace = true, features = ["serde"] }

[dev-dependencies]
chia-traits = { workspace = true }
tokio = { workspace = true, features = ["full"] }
